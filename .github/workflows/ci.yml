name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: JS sin errores de sintaxis
        run: node --check static/app.js
      - name: Scripts de shell
        run: |
          for f in install.sh updater/updater.sh ct/mitallercito.sh install/mitallercito-install.sh bridge/install-bridge.sh tools/*.sh docker/entrypoint.sh; do bash -n "$f"; done
          shellcheck -S error install.sh updater/updater.sh ct/mitallercito.sh install/mitallercito-install.sh bridge/install-bridge.sh tools/*.sh docker/entrypoint.sh
      - name: Puente (compila)
        run: python -m py_compile bridge/mitallercito-bridge.py updater/verify.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mitallercito:ci .
      - name: Arranca y responde
        run: |
          docker run -d --name t3d -p 8080:8080 mitallercito:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/brand && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/api/setup | grep -q '"needed":true'
          docker logs t3d | grep -q "#setup="
